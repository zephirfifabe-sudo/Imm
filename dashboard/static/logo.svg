<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.35" stop-color="#f2c94c"/>
      <stop offset="0.7" stop-color="#c9952b"/>
      <stop offset="1" stop-color="#8a5a12"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#070b14"/>
    </radialGradient>
  </defs>

  <!-- fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- carte dorée façon « Légende » -->
  <path d="M256 44 L300 70 L392 70 L404 112 L404 372 Q404 404 372 418 L256 468 L140 418 Q108 404 108 372 L108 112 L120 70 L212 70 Z"
