  <path d="M256 60 L296 84 L382 84 L390 114 L390 220 L122 220 L122 114 L130 84 L216 84 Z" fill="url(#shine)"/>
  <path d="M256 78 L292 98 L370 98 L376 118 L376 368 Q376 390 354 400 L256 444 L158 400 Q136 390 136 368 L136 118 L142 98 L220 98 Z"
        fill="none" stroke="#7a4e0e" stroke-width="3" opacity="0.7"/>

  <!-- étoiles « légende » -->
  <g fill="#7a4e0e">
    <path d="M206 128 l5 10 11 2 -8 8 2 11 -10 -5 -10 5 2 -11 -8 -8 11 -2z"/>
    <path d="M256 118 l6 12 13 2 -10 9 3 13 -12 -6 -12 6 3 -13 -10 -9 13 -2z"/>
    <path d="M306 128 l5 10 11 2 -8 8 2 11 -10 -5 -10 5 2 -11 -8 -8 11 -2z"/>
  </g>

  <!-- viseur -->
  <g transform="translate(256 262)" fill="none" stroke="#1a1206" stroke-linecap="round">
    <circle r="78" stroke-width="12"/>
    <circle r="44" stroke-width="5" opacity="0.8"/>
    <line x1="0" y1="-104" x2="0" y2="-54" stroke-width="10"/>
    <line x1="0" y1="54" x2="0" y2="84" stroke-width="10"/>
    <line x1="-104" y1="0" x2="-54" y2="0" stroke-width="10"/>
    <line x1="54" y1="0" x2="104" y2="0" stroke-width="10"/>
    <!-- courbe de prix qui remonte -->
    <polyline points="-40,18 -18,4 -2,14 18,-12 40,-28" stroke="#0f8a4b" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <circle cx="256" cy="262" r="7" fill="#e5383b"/>

  <!-- légende -->
  <text x="256" y="388" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-weight="900" font-size="46" letter-spacing="3" fill="#1a1206">SNIPER</text>
  <text x="256" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
